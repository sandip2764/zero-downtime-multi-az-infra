name: Initialize Karfect Database

on:
  workflow_dispatch:

env:
  AWS_REGION: us-east-1
  DB_NAME: karfect
  SQL_FILE: app/karfect/Database/karfect.sql

jobs:

  database-deploy:

    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: terraform/environment

    steps:

      # ========================================
      # 1. Checkout Repository
      # ========================================

      - name: Checkout Repository
        uses: actions/checkout@v4


      # ========================================
      # 2. Configure AWS Credentials
      # ========================================

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}


      # ========================================
      # 3. Install Terraform
      # ========================================

      - name: Install Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.13.1


      # ========================================
      # 4. Terraform Init
      # ========================================

      - name: Terraform Init
        run: terraform init


      # ========================================
      # 5. Get S3 Bucket Name
      # ========================================

      - name: Get DB Artifact Bucket
        id: bucket
        run: |

          BUCKET=$(terraform output -raw db_artifact_bucket)

          if [ -z "$BUCKET" ]; then
            echo "ERROR: Terraform output db_artifact_bucket is empty."
            exit 1
          fi

          echo "DB artifact bucket: $BUCKET"

          echo "bucket=$BUCKET" >> "$GITHUB_OUTPUT"


      # ========================================
      # 6. Upload SQL File to S3
      # ========================================

      - name: Upload Database SQL
        working-directory: ${{ github.workspace }}
        run: |

          if [ ! -f "${SQL_FILE}" ]; then
            echo "ERROR: SQL file not found: ${SQL_FILE}"
            exit 1
          fi

          echo "Uploading ${SQL_FILE}..."

          aws s3 cp \
            "${SQL_FILE}" \
            "s3://${{ steps.bucket.outputs.bucket }}/database/karfect.sql"

          echo "SQL file uploaded successfully."


      # ========================================
      # 7. Find Running Application EC2
      # ========================================

      - name: Find Application EC2
        id: instance
        working-directory: ${{ github.workspace }}
        run: |

          echo "Finding running application EC2..."

          INSTANCE_ID=$(aws ec2 describe-instances \
            --region "${AWS_REGION}" \
            --filters \
              "Name=tag:Role,Values=karfect-app" \
              "Name=instance-state-name,Values=running" \
            --query 'Reservations[].Instances[].InstanceId | [0]' \
            --output text)

          echo "Found instance: ${INSTANCE_ID}"

          if [ "${INSTANCE_ID}" = "None" ] || [ -z "${INSTANCE_ID}" ]; then
            echo "ERROR: No running EC2 instance found."
            echo "Expected tag: Role=karfect-app"
            exit 1
          fi

          echo "instance_id=${INSTANCE_ID}" >> "$GITHUB_OUTPUT"


      # ========================================
      # 8. Send Database Initialization Command
      # ========================================

      - name: Send Database Initialization Command
        id: ssm
        working-directory: ${{ github.workspace }}
        env:
          BUCKET: ${{ steps.bucket.outputs.bucket }}
          INSTANCE_ID: ${{ steps.instance.outputs.instance_id }}
        run: |

          echo "Building remote script..."

          # --- Part 1: values already known to the runner. -----------------
          # This heredoc is UNQUOTED on purpose so these three get expanded now.
          cat > remote-script.sh <<VARS
          BUCKET="${BUCKET}"
          AWS_REGION="${AWS_REGION}"
          DB_NAME="${DB_NAME}"
          VARS

          # --- Part 2: the actual remote logic. -----------------------------
          # This heredoc delimiter is QUOTED ('REMOTE'), so bash does NOT expand
          # $VAR or $(...) here at all. Everything stays literal text and only
          # runs later, on the EC2 instance, when SSM executes it. This is what
          # stops secrets from ever being touched/printed on the runner.
          cat >> remote-script.sh <<'REMOTE'
          set -e

          echo '========================================'
          echo 'Installing MySQL client'
          echo '========================================'

          sudo apt-get update -y
          sudo apt-get install -y mysql-client jq

          echo '========================================'
          echo 'Downloading SQL file from S3'
          echo '========================================'

          aws s3 cp "s3://${BUCKET}/database/karfect.sql" /tmp/karfect.sql

          echo '========================================'
          echo 'Reading database secret'
          echo '========================================'

          SECRET=$(aws secretsmanager get-secret-value --secret-id db_secret_manager --region "${AWS_REGION}" --query SecretString --output text)

          DB_HOST=$(echo "$SECRET" | jq -r '.host')
          DB_USER=$(echo "$SECRET" | jq -r '.username')
          DB_PASS=$(echo "$SECRET" | jq -r '.password')

          echo 'Database credentials loaded successfully.'

          echo '========================================'
          echo 'Creating database'
          echo '========================================'

          export MYSQL_PWD="$DB_PASS"
          mysql -h "$DB_HOST" -u "$DB_USER" -e "CREATE DATABASE IF NOT EXISTS ${DB_NAME};"

          echo '========================================'
          echo 'Importing database'
          echo '========================================'

          mysql -h "$DB_HOST" -u "$DB_USER" "${DB_NAME}" < /tmp/karfect.sql
          unset MYSQL_PWD

          echo '========================================'
          echo 'Database import completed successfully'
          echo '========================================'

          rm -f /tmp/karfect.sql

          echo 'Temporary SQL file deleted.'
          REMOTE

          echo "Remote script built."

          # jq turns each line into a correctly-escaped JSON string automatically -
          # no hand-written backslashes, so this class of bug can't happen again.
          jq -Rsc '{"commands": (split("\n") | map(select(length > 0)))}' remote-script.sh > ssm-commands.json

          echo "SSM command payload created."

          COMMAND_ID=$(aws ssm send-command \
            --region "${AWS_REGION}" \
            --instance-ids "${INSTANCE_ID}" \
            --document-name "AWS-RunShellScript" \
            --parameters file://ssm-commands.json \
            --query 'Command.CommandId' \
            --output text)

          echo "SSM Command ID: ${COMMAND_ID}"

          echo "command_id=${COMMAND_ID}" >> "$GITHUB_OUTPUT"


      # ========================================
      # 9. Wait for SSM Command
      # ========================================

      - name: Wait for SSM Command
        working-directory: ${{ github.workspace }}
        run: |

          echo "Waiting for database initialization..."

          # aws ssm wait command-executed gives up after ~100s (5s delay x 20
          # attempts, hardcoded, no CLI flag to extend it). apt-get + the SQL
          # import routinely take longer than that, so we poll ourselves with
          # a much bigger ceiling instead of relying on the built-in waiter.

          COMMAND_ID="${{ steps.ssm.outputs.command_id }}"
          INSTANCE_ID="${{ steps.instance.outputs.instance_id }}"

          MAX_ATTEMPTS=120   # 120 * 15s = 30 minutes ceiling - raise if your SQL file is huge
          DELAY=15

          for ((i=1; i<=MAX_ATTEMPTS; i++)); do

            STATUS=$(aws ssm get-command-invocation \
              --region "${AWS_REGION}" \
              --command-id "${COMMAND_ID}" \
              --instance-id "${INSTANCE_ID}" \
              --query 'Status' \
              --output text 2>/dev/null || echo "Pending")

            echo "Attempt ${i}/${MAX_ATTEMPTS} - status: ${STATUS}"

            case "${STATUS}" in
              Success|Failed|Cancelled|TimedOut|Cancelling)
                echo "SSM command reached terminal status: ${STATUS}"
                exit 0
                ;;
              *)
                sleep "${DELAY}"
                ;;
            esac

          done

          echo "ERROR: Timed out after $((MAX_ATTEMPTS * DELAY)) seconds waiting for SSM command to finish."
          exit 1


      # ========================================
      # 10. Check SSM Result
      # ========================================

      - name: Check Database Import Result
        working-directory: ${{ github.workspace }}
        run: |

          STATUS=$(aws ssm get-command-invocation \
            --region "${AWS_REGION}" \
            --command-id "${{ steps.ssm.outputs.command_id }}" \
            --instance-id "${{ steps.instance.outputs.instance_id }}" \
            --query 'Status' \
            --output text)

          echo "SSM Status: ${STATUS}"

          echo ""
          echo "========== COMMAND OUTPUT =========="

          aws ssm get-command-invocation \
            --region "${AWS_REGION}" \
            --command-id "${{ steps.ssm.outputs.command_id }}" \
            --instance-id "${{ steps.instance.outputs.instance_id }}" \
            --query 'StandardOutputContent' \
            --output text

          echo ""
          echo "========== COMMAND ERROR =========="

          aws ssm get-command-invocation \
            --region "${AWS_REGION}" \
            --command-id "${{ steps.ssm.outputs.command_id }}" \
            --instance-id "${{ steps.instance.outputs.instance_id }}" \
            --query 'StandardErrorContent' \
            --output text

          if [ "${STATUS}" != "Success" ]; then
            echo "ERROR: Database initialization failed."
            exit 1
          fi

          echo "Database initialization successful."


      # ========================================
      # 11. Delete SQL from S3
      # ========================================

      - name: Delete SQL File from S3
        if: always()
        working-directory: ${{ github.workspace }}
        run: |

          echo "Removing SQL file from S3..."

          aws s3 rm \
            "s3://${{ steps.bucket.outputs.bucket }}/database/karfect.sql"

          echo "SQL file removed from S3."