name: Initialize Karfect Database

on:
  workflow_dispatch:

env:
  AWS_REGION: us-east-1
  DB_NAME: karfect
  SQL_FILE: app/karfect/Database/karfect.sql

jobs:

  database-deploy:

    runs-on: ubuntu-latest

    steps:

      # ----------------------------------------
      # Checkout
      # ----------------------------------------

      - name: Checkout Repository
        uses: actions/checkout@v4


      # ----------------------------------------
      # AWS Credentials
      # ----------------------------------------

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}


      # ----------------------------------------
      # Get S3 Bucket Name
      # ----------------------------------------

      - name: Get DB Artifact Bucket
        id: bucket
        run: |

          BUCKET=$(aws s3api list-buckets \
            --query "Buckets[?starts_with(Name, '${{ github.event.repository.name }}-db-artifacts')].Name | [0]" \
            --output text)

          echo "Bucket: ${BUCKET}"

          echo "bucket=${BUCKET}" >> "$GITHUB_OUTPUT"


      # ----------------------------------------
      # Upload SQL
      # ----------------------------------------

      - name: Upload Database SQL
        run: |

          aws s3 cp \
            "${SQL_FILE}" \
            "s3://${{ steps.bucket.outputs.bucket }}/database/karfect.sql"


      # ----------------------------------------
      # Find Running Application EC2
      # ----------------------------------------

      - name: Find Application EC2
        id: instance
        run: |

          INSTANCE_ID=$(aws ec2 describe-instances \
            --region "${AWS_REGION}" \
            --filters \
              "Name=tag:Role,Values=karfect-app" \
              "Name=instance-state-name,Values=running" \
            --query 'Reservations[].Instances[].InstanceId | [0]' \
            --output text)

          echo "Instance ID: ${INSTANCE_ID}"

          if [ "${INSTANCE_ID}" = "None" ] || [ -z "${INSTANCE_ID}" ]; then
            echo "No running application EC2 found."
            exit 1
          fi

          echo "instance_id=${INSTANCE_ID}" >> "$GITHUB_OUTPUT"


      # ----------------------------------------
      # Send SSM Command
      # ----------------------------------------

      - name: Initialize Database
        id: ssm
        run: |

          COMMAND_ID=$(aws ssm send-command \
            --region "${AWS_REGION}" \
            --instance-ids "${{ steps.instance.outputs.instance_id }}" \
            --document-name "AWS-RunShellScript" \
            --parameters 'commands=[
              "set -e",
              "echo Installing MySQL client...",
              "sudo apt-get update -y",
              "sudo apt-get install -y mysql-client",
              "echo Downloading SQL file...",
              "aws s3 cp s3://${{ steps.bucket.outputs.bucket }}/database/karfect.sql /tmp/karfect.sql",
              "echo Reading database secret...",
              "SECRET=$(aws secretsmanager get-secret-value --secret-id db_secret_manager --region us-east-1 --query SecretString --output text)",
              "DB_HOST=$(echo \"$SECRET\" | python3 -c \"import sys,json; print(json.load(sys.stdin)['host'])\")",
              "DB_USER=$(echo \"$SECRET\" | python3 -c \"import sys,json; print(json.load(sys.stdin)['username'])\")",
              "DB_PASS=$(echo \"$SECRET\" | python3 -c \"import sys,json; print(json.load(sys.stdin)['password'])\")",
              "echo Creating database...",
              "mysql -h \"$DB_HOST\" -u \"$DB_USER\" -p\"$DB_PASS\" -e \"CREATE DATABASE IF NOT EXISTS ${DB_NAME};\"",
              "echo Importing database...",
              "mysql -h \"$DB_HOST\" -u \"$DB_USER\" -p\"$DB_PASS\" \"${DB_NAME}\" < /tmp/karfect.sql",
              "echo Database import completed successfully.",
              "rm -f /tmp/karfect.sql"
            ]' \
            --query 'Command.CommandId' \
            --output text)

          echo "Command ID: ${COMMAND_ID}"

          echo "command_id=${COMMAND_ID}" >> "$GITHUB_OUTPUT"


      # ----------------------------------------
      # Wait for SSM Command
      # ----------------------------------------

      - name: Wait for Database Import
        run: |

          aws ssm wait command-executed \
            --region "${AWS_REGION}" \
            --command-id "${{ steps.ssm.outputs.command_id }}" \
            --instance-id "${{ steps.instance.outputs.instance_id }}"


      # ----------------------------------------
      # Show SSM Output
      # ----------------------------------------

      - name: Show Database Import Result
        run: |

          aws ssm get-command-invocation \
            --region "${AWS_REGION}" \
            --command-id "${{ steps.ssm.outputs.command_id }}" \
            --instance-id "${{ steps.instance.outputs.instance_id }}" \
            --query '{Status:Status,Output:StandardOutputContent,Error:StandardErrorContent}' \
            --output json


      # ----------------------------------------
      # Delete SQL from S3
      # ----------------------------------------

      - name: Delete SQL Artifact
        if: always()
        run: |

          aws s3 rm \
            "s3://${{ steps.bucket.outputs.bucket }}/database/karfect.sql"