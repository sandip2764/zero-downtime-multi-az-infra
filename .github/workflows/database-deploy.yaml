name: Initialize Karfect Database

on:
  workflow_dispatch:

env:
  AWS_REGION: us-east-1
  DB_NAME: karfect
  SECRET_NAME: db_secret_manager

jobs:

  database-deploy:

    runs-on: ubuntu-latest

    steps:

      # ========================================
      # Checkout Repository
      # ========================================

      - name: Checkout Repository
        uses: actions/checkout@v4


      # ========================================
      # Configure AWS Credentials
      # ========================================

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}


      # ========================================
      # Find Running Karfect EC2
      # ========================================

      - name: Get Running EC2 Instance
        id: instance
        run: |

          INSTANCE_ID=$(aws ec2 describe-instances \
            --region "${AWS_REGION}" \
            --filters \
              "Name=tag:Role,Values=karfect-app" \
              "Name=instance-state-name,Values=running" \
            --query 'Reservations[].Instances[0].InstanceId' \
            --output text)

          if [ -z "$INSTANCE_ID" ] || [ "$INSTANCE_ID" = "None" ]; then
            echo "No running Karfect EC2 instance found."
            exit 1
          fi

          echo "Using EC2: $INSTANCE_ID"

          echo "instance_id=$INSTANCE_ID" >> "$GITHUB_OUTPUT"


      # ========================================
      # Encode SQL File
      # ========================================

      - name: Encode SQL File
        id: sql
        run: |

          if [ ! -f "app/karfect/Database/karfect.sql" ]; then
            echo "SQL file not found!"
            exit 1
          fi

          base64 -w 0 app/karfect/Database/karfect.sql > /tmp/karfect.sql.b64

          echo "SQL file encoded successfully."


      # ========================================
      # Send Database Command through SSM
      # ========================================

      - name: Initialize RDS Database
        env:
          INSTANCE_ID: ${{ steps.instance.outputs.instance_id }}
        run: |

          SQL_BASE64=$(cat /tmp/karfect.sql.b64)

          COMMAND_ID=$(aws ssm send-command \
            --region "${AWS_REGION}" \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters "commands=[
              \"set -e\",
              \"echo 'Installing MySQL client...'\",
              \"sudo apt-get update -y\",
              \"sudo apt-get install -y mysql-client\",
              \"echo 'Reading database secret...'\",
              \"SECRET=\\$(aws secretsmanager get-secret-value --secret-id ${SECRET_NAME} --region ${AWS_REGION} --query SecretString --output text)\",
              \"DB_HOST=\\$(echo \\\"\\$SECRET\\\" | python3 -c 'import sys,json; print(json.load(sys.stdin)[\\\"host\\\"])')\",
              \"DB_USER=\\$(echo \\\"\\$SECRET\\\" | python3 -c 'import sys,json; print(json.load(sys.stdin)[\\\"username\\\"])')\",
              \"DB_PASS=\\$(echo \\\"\\$SECRET\\\" | python3 -c 'import sys,json; print(json.load(sys.stdin)[\\\"password\\\"])')\",
              \"echo 'Creating database...'\",
              \"mysql -h \\\"\\$DB_HOST\\\" -u \\\"\\$DB_USER\\\" -p\\\"\\$DB_PASS\\\" -e 'CREATE DATABASE IF NOT EXISTS ${DB_NAME};'\",
              \"echo 'Writing SQL file...'\",
              \"echo '${SQL_BASE64}' | base64 -d > /tmp/karfect.sql\",
              \"echo 'Importing database...'\",
              \"mysql -h \\\"\\$DB_HOST\\\" -u \\\"\\$DB_USER\\\" -p\\\"\\$DB_PASS\\\" ${DB_NAME} < /tmp/karfect.sql\",
              \"rm -f /tmp/karfect.sql\",
              \"echo 'Database initialization completed successfully.'\"
            ]" \
            --query 'Command.CommandId' \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

          echo "Waiting for SSM command..."

          aws ssm wait command-executed \
            --region "${AWS_REGION}" \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID"

          echo "Database deployment completed."