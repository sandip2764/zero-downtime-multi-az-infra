name: Initialize Karfect Database

on:
  workflow_dispatch:

env:
  AWS_REGION: us-east-1
  DB_NAME: karfect
  SQL_FILE: app/karfect/Database/karfect.sql

jobs:

  database-deploy:

    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: terraform/environment

    steps:

      # ========================================
      # 1. Checkout Repository
      # ========================================

      - name: Checkout Repository
        uses: actions/checkout@v4


      # ========================================
      # 2. Configure AWS Credentials
      # ========================================

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}


      # ========================================
      # 3. Install Terraform
      # ========================================

      - name: Install Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.13.1


      # ========================================
      # 4. Terraform Init
      # ========================================

      - name: Terraform Init
        run: terraform init


      # ========================================
      # 5. Get S3 Bucket Name from Terraform State
      # ========================================

      - name: Get DB Artifact Bucket
        id: bucket
        run: |

          BUCKET=$(terraform output -raw db_artifact_bucket_name)

          if [ -z "$BUCKET" ]; then
            echo "ERROR: Terraform output db_artifact_bucket_name is empty."
            exit 1
          fi

          echo "DB artifact bucket: $BUCKET"

          echo "bucket=$BUCKET" >> "$GITHUB_OUTPUT"


      # ========================================
      # 6. Upload SQL File to S3
      # ========================================

      - name: Upload Database SQL
        working-directory: ${{ github.workspace }}
        run: |

          if [ ! -f "${SQL_FILE}" ]; then
            echo "ERROR: SQL file not found: ${SQL_FILE}"
            exit 1
          fi

          echo "Uploading ${SQL_FILE}..."

          aws s3 cp \
            "${SQL_FILE}" \
            "s3://${{ steps.bucket.outputs.bucket }}/database/karfect.sql"

          echo "SQL file uploaded successfully."


      # ========================================
      # 7. Find Running Application EC2
      # ========================================

      - name: Find Application EC2
        id: instance
        working-directory: ${{ github.workspace }}
        run: |

          echo "Finding running application EC2..."

          INSTANCE_ID=$(aws ec2 describe-instances \
            --region "${AWS_REGION}" \
            --filters \
              "Name=tag:Role,Values=karfect-app" \
              "Name=instance-state-name,Values=running" \
            --query 'Reservations[].Instances[].InstanceId | [0]' \
            --output text)

          echo "Found instance: ${INSTANCE_ID}"

          if [ "${INSTANCE_ID}" = "None" ] || [ -z "${INSTANCE_ID}" ]; then
            echo "ERROR: No running EC2 instance found with:"
            echo "Role=karfect-app"
            exit 1
          fi

          echo "instance_id=${INSTANCE_ID}" >> "$GITHUB_OUTPUT"


      # ========================================
      # 8. Create SSM Command JSON
      # ========================================

      - name: Create SSM Command
        id: ssm
        working-directory: ${{ github.workspace }}
        run: |

          BUCKET="${{ steps.bucket.outputs.bucket }}"
          INSTANCE_ID="${{ steps.instance.outputs.instance_id }}"

          python3 - <<PY
          import json

          bucket = "${BUCKET}"
          db_name = "${DB_NAME}"

          commands = [
              "set -e",

              "echo '========================================'",
              "echo 'Installing MySQL client'",
              "echo '========================================'",

              "sudo apt-get update -y",
              "sudo apt-get install -y mysql-client",

              "echo '========================================'",
              "echo 'Downloading SQL file from S3'",
              "echo '========================================'",

              f"aws s3 cp s3://{bucket}/database/karfect.sql /tmp/karfect.sql",

              "echo '========================================'",
              "echo 'Reading database secret'",
              "echo '========================================'",

              "SECRET=$(aws secretsmanager get-secret-value --secret-id db_secret_manager --region us-east-1 --query SecretString --output text)",

              "DB_HOST=$(echo \"$SECRET\" | python3 -c \"import sys,json; print(json.load(sys.stdin)['host'])\")",

              "DB_USER=$(echo \"$SECRET\" | python3 -c \"import sys,json; print(json.load(sys.stdin)['username'])\")",

              "DB_PASS=$(echo \"$SECRET\" | python3 -c \"import sys,json; print(json.load(sys.stdin)['password'])\")",

              "echo 'Database credentials loaded successfully.'",

              "echo '========================================'",
              "echo 'Creating database'",
              "echo '========================================'",

              f"mysql -h \"$DB_HOST\" -u \"$DB_USER\" -p\"$DB_PASS\" -e \"CREATE DATABASE IF NOT EXISTS {db_name};\"",

              "echo '========================================'",
              "echo 'Importing SQL database'",
              "echo '========================================'",

              f"mysql -h \"$DB_HOST\" -u \"$DB_USER\" -p\"$DB_PASS\" {db_name} < /tmp/karfect.sql",

              "echo '========================================'",
              "echo 'Database import completed successfully'",
              "echo '========================================'",

              "rm -f /tmp/karfect.sql",

              "echo 'Temporary SQL file deleted.'"
          ]

          with open("/tmp/ssm-commands.json", "w") as f:
              json.dump({"commands": commands}, f)

          print("SSM command payload created.")


          COMMAND_ID=$(aws ssm send-command \
            --region "${AWS_REGION}" \
            --instance-ids "${INSTANCE_ID}" \
            --document-name "AWS-RunShellScript" \
            --parameters file:///tmp/ssm-commands.json \
            --query 'Command.CommandId' \
            --output text)

          echo "SSM Command ID: ${COMMAND_ID}"

          echo "command_id=${COMMAND_ID}" >> "$GITHUB_OUTPUT"


      # ========================================
      # 9. Wait for SSM Command
      # ========================================

      - name: Wait for SSM Command
        working-directory: ${{ github.workspace }}
        run: |

          echo "Waiting for database initialization..."

          aws ssm wait command-executed \
            --region "${AWS_REGION}" \
            --command-id "${{ steps.ssm.outputs.command_id }}" \
            --instance-id "${{ steps.instance.outputs.instance_id }}"

          echo "SSM command finished."


      # ========================================
      # 10. Check SSM Result
      # ========================================

      - name: Check Database Import Result
        working-directory: ${{ github.workspace }}
        run: |

          STATUS=$(aws ssm get-command-invocation \
            --region "${AWS_REGION}" \
            --command-id "${{ steps.ssm.outputs.command_id }}" \
            --instance-id "${{ steps.instance.outputs.instance_id }}" \
            --query 'Status' \
            --output text)

          echo "SSM Status: ${STATUS}"

          echo ""
          echo "========== COMMAND OUTPUT =========="
          
          aws ssm get-command-invocation \
            --region "${AWS_REGION}" \
            --command-id "${{ steps.ssm.outputs.command_id }}" \
            --instance-id "${{ steps.instance.outputs.instance_id }}" \
            --query 'StandardOutputContent' \
            --output text

          echo ""
          echo "========== COMMAND ERROR =========="

          aws ssm get-command-invocation \
            --region "${AWS_REGION}" \
            --command-id "${{ steps.ssm.outputs.command_id }}" \
            --instance-id "${{ steps.instance.outputs.instance_id }}" \
            --query 'StandardErrorContent' \
            --output text

          if [ "${STATUS}" != "Success" ]; then
            echo "ERROR: Database initialization failed."
            exit 1
          fi

          echo "Database initialization successful."


      # ========================================
      # 11. Delete SQL from S3
      # ========================================

      - name: Delete SQL File from S3
        if: always()
        working-directory: ${{ github.workspace }}
        run: |

          echo "Removing SQL file from S3..."

          aws s3 rm \
            "s3://${{ steps.bucket.outputs.bucket }}/database/karfect.sql"

          echo "SQL file removed from S3."